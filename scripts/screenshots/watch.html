<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mountain Sunrise · Horizon Clips</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; background: #f6f7fb; color: #1d2333; }
  header { display: flex; align-items: center; gap: 28px; height: 52px; padding: 0 24px; background: #fff; border-bottom: 1px solid #e3e6ef; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: .2px; }
  .logo i { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #f6aa6e 0 50%, #3b4482 50%); display: inline-block; }
  nav { display: flex; gap: 20px; color: #5b6278; }
  nav b { color: #1d2333; }
  .search { margin-left: auto; width: 220px; height: 30px; border-radius: 15px; background: #eef0f6; color: #8a90a3; padding: 5px 14px; font-size: 13px; }
  main { display: grid; grid-template-columns: 1fr 250px; gap: 20px; padding: 18px 24px; }
  .player { position: relative; border-radius: 10px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; }
  .player video { width: 100%; height: 100%; display: block; }
  h1 { font-size: 19px; margin: 12px 0 2px; }
  .meta { color: #6b7186; font-size: 13px; }
  aside h2 { font-size: 13px; margin: 0 0 10px; color: #5b6278; text-transform: uppercase; letter-spacing: .6px; }
  .card { display: grid; grid-template-columns: 112px 1fr; gap: 10px; margin-bottom: 12px; font-size: 13px; }
  .card img, .card video { width: 112px; height: 63px; object-fit: cover; border-radius: 6px; display: block; }
  .card b { display: block; line-height: 1.3; }
  .card span { color: #8a90a3; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>Horizon Clips</div>
  <nav><b>Watch</b><span>Explore</span><span>Collections</span></nav>
  <div class="search">Search clips</div>
</header>
<main>
  <section>
    <div class="player"><video id="v" muted autoplay loop playsinline poster="thumbs/sunrise.jpg"></video></div>
    <h1>Mountain Sunrise</h1>
    <div class="meta">Horizon Clips · 24 s · 1080p</div>
  </section>
  <aside>
    <h2>Up next</h2>
    <div class="card"><video src="clip.mp4" muted autoplay loop playsinline></video><div><b>Ocean Drift</b><span>Preview · 12 s</span></div></div>
    <div class="card"><img src="thumbs/forest.jpg" alt=""><div><b>Quiet Forest</b><span>18 s</span></div></div>
    <div class="card"><img src="thumbs/desert.jpg" alt=""><div><b>Desert Dusk</b><span>21 s</span></div></div>
    <div class="card"><img src="thumbs/night.jpg" alt=""><div><b>Starry Ridge</b><span>30 s</span></div></div>
  </aside>
</main>
<script src="hls.min.js"></script>
<script>
  const v = document.getElementById('v');
  const hls = new Hls();
  hls.loadSource('hls/master.m3u8');
  hls.attachMedia(v);
</script>
</body>
</html>
