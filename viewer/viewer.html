<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VideoToGo</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <form id="bar">
      <button id="back" type="button" data-i18n-title="back">←</button>
      <button id="forward" type="button" data-i18n-title="forward">→</button>
      <input id="addr" type="text" data-i18n-placeholder="addressPlaceholder" autocomplete="off" spellcheck="false" />
    </form>
    <iframe
      id="frame"
      name="vd-page"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation allow-downloads allow-modals"
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    ></iframe>
    <div id="captures"></div>
    <ul id="media" class="list"></ul>
    <section id="queue">
      <h2 data-i18n="queueHeading"></h2>
      <ul id="jobs" class="list"></ul>
    </section>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
